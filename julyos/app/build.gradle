plugins {
    id 'com.android.application'
}

android {
    namespace 'com.july.os'
    compileSdk 34

    defaultConfig {
        applicationId 'com.july.os'
        minSdk 17
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideload builds: signed with the debug key until a July release key exists.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
