plugins {
    id 'com.android.application'
}

android {
    namespace 'com.july.os'
    compileSdk 34

    defaultConfig {
        applicationId 'com.july.os'
        minSdk 17
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'armeabi-v7a' } // the Y1's MT6572
        // H21 Updates compares this with the newest commit on GitHub.
        def sha = 'unknown'
        try { sha = 'git rev-parse --short HEAD'.execute([], rootDir).text.trim() } catch (ignored) { }
        buildConfigField 'String', 'GIT_SHA', '"' + sha + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideload builds: signed with the debug key until a July release key exists.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Modern TLS (1.2/1.3) on Android 4.2, same library Solar shipped.
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
}
