plugins {
    id 'com.android.application'
}

android {
    namespace 'com.july.os'
    compileSdk 34

    defaultConfig {
        applicationId 'com.july.os'
        minSdk 17
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'armeabi-v7a' } // the Y1's MT6572
        // H21 Updates compares this with the newest commit on GitHub.
        def sha = 'unknown'
        try { sha = 'git rev-parse --short HEAD'.execute([], rootDir).text.trim() } catch (ignored) { }
        buildConfigField 'String', 'GIT_SHA', '"' + sha + '"'
        buildConfigField 'String', 'LASTFM_USER', '"' + (project.findProperty('JULY_LASTFM_USER') ?: '') + '"'
        buildConfigField 'String', 'LASTFM_API_KEY', '"' + (project.findProperty('JULY_LASTFM_API_KEY') ?: '') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideload builds: signed with the debug key until a July release key exists.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Modern TLS (1.2/1.3) on Android 4.2, same library Solar shipped.
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    // Sunmi built-in thermal printer (T2 and other Sunmi terminals); unused on the Y1.
    implementation 'com.sunmi:printerlibrary:1.0.24'
    // July Radio on Android 5+ (Sunmi T2): the platform player takes ~40 s to start the live MP3.
    implementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    // July Station draws the design's SVG icons with PathParser (already shipped with ExoPlayer).
    implementation 'androidx.core:core:1.8.0'
    // QR codes on printed receipts (drawn into the receipt bitmap, so the preview matches the paper).
    implementation 'com.google.zxing:core:3.5.3'
}
